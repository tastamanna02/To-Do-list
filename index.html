<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal To-Do • Clean & Simple</title>
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="todo-wrapper">
    <!-- Header -->
    <header class="todo-header">
      <div class="header-left">
        <h1 class="title">Today</h1>
        <p class="date" id="date-display">Loading date...</p>
      </div>
      <button id="theme-btn" class="theme-toggle" title="Switch Theme" aria-label="Toggle theme">
        <!-- Sun Icon -->
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon -->
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <!-- Clean Progress Bar -->
    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-text" id="progress-text">0% completed</span>
        <span class="task-counter" id="task-counter">0 of 0 done</span>
      </div>
      <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Task completion progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Input Form -->
    <form id="todo-form" class="todo-form">
      <div class="input-box">
        <input 
          type="text" 
          id="task-input" 
          placeholder="Add a new task..." 
          autocomplete="off"
          required
        />
        <button type="submit" id="add-btn" class="add-button" title="Add Task">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </form>

    <!-- Filters & Actions -->
    <div class="filter-bar">
      <div class="filter-tabs" role="tablist" aria-label="Task filters">
        <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button class="filter-tab" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button class="filter-tab" data-filter="completed" role="tab" aria-selected="false">Completed</button>
      </div>
      <button id="clear-btn" class="clear-btn" title="Clear completed tasks">Clear completed</button>
    </div>

    <!-- Task List -->
    <ul id="task-list" class="task-list"></ul>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state">
      <p id="empty-message">No tasks yet. Enjoy your day! 🌿</p>
    </div>

    <!-- Footer Status -->
    <footer class="todo-footer">
      <span id="items-left">0 items left</span>
      <span class="auto-save">✓ Auto-saved to browser</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
